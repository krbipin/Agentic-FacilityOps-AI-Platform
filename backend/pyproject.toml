[project]
name = "facilityops-backend"
version = "0.1.0"
description = "FastAPI backend for the Agentic FacilityOps AI Platform"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.141,<1",
  "uvicorn[standard]>=0.34,<1",
  "pandas>=3.0,<4",
  "numpy>=2,<3",
  "scikit-learn>=1.9,<2",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.10,<3",
]

[tool.uv]
package = false
